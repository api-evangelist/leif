aid: leif
name: Leif
description: 'Leif (Leif Technologies, Inc.) was a New York City education-finance
  technology company, founded in 2017 by Francis Larson, Jeffrey Groeber and Richard
  Lee, that built an end-to-end platform for designing, originating, servicing and
  financing outcomes-aligned tuition products for schools and bootcamps. Its product
  line covered Income Share Agreements, contingent payment plans, tuition installment
  plans and upfront payment, alongside career-services and advisory-insights modules,
  and the platform handled student identity verification, credit evaluation, income
  verification, disbursement, payment collection and program reporting for its school
  partners. Leif publicly claimed more than 20,000 originations across 200+ partner
  schools and over $400 million in arranged financing, and it raised a strategic
  financing round totalling more than $60 million in 2021. Leif never operated a
  public developer program: the archived marketing site carries no developer portal,
  API reference or documentation nav, and the only API surface ever visible was the
  private JSON API behind its own student and school applications (leif.org/api/*).
  As of the 2026-08-25 probe the company''s entire public surface is dark — leif.org
  and www.leif.org fail the TLS handshake at their Webflow edge, app.leif.org returns
  504 on every path, the Zendesk help center is gone, and the api.leif.org and
  sandbox.leif.org AWS API Gateway hosts answer only "Missing Authentication Token".'
